version: "3.9"

services:
  python-app:
    image: python:3.12-slim
    working_dir: /app
    ports:
      - "8085:8085"
    environment:
      - PYTHONUNBUFFERED=1
    command: >
      sh -c "apt-get update && \
      apt-get install -y --no-install-recommends git && \
      rm -rf /var/lib/apt/lists/* && \
      git clone https://github.com/dzCazador/ITS-DevOps-Lab2-SitioBancoPython.git /app && \
      python -m pip install --no-cache-dir --upgrade pip && \
      python -m pip install --no-cache-dir -r requirements.txt && \
      python main.py"
